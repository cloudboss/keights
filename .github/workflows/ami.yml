name: ami

# Build and publish a keights AMI for a (keights tag, kubernetes patch) pair.

on:
  workflow_dispatch:
    inputs:
      keights_tag:
        description: "Keights tag to build from, e.g. v2.0.0"
        required: true
        type: string
      kubernetes_version:
        description: "Kubernetes patch version, e.g. 1.34.5"
        required: true
        type: string
  workflow_call:
    inputs:
      keights_tag:
        required: true
        type: string
      kubernetes_version:
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: true
      SUBNET_ID_PUBLIC:
        required: true
      VPC_ID:
        required: true
      SUBNET_IDS_PRIVATE:
        required: true
      KMS_KEY_ID:
        required: true
      STATE_BUCKET:
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      packages: write
    outputs:
      ami_id: ${{ steps.ami.outputs.ami_id }}
      ami_name: ${{ steps.ami.outputs.ami_name }}
      bucket: ${{ steps.bucket.outputs.name }}
      scenarios: ${{ steps.scenarios.outputs.list }}
      source_ami_name: ${{ steps.source.outputs.AMI_NAME }}
      source_version: ${{ steps.source.outputs.SOURCE_VERSION }}
    env:
      VERSION: ${{ inputs.keights_tag }}
      KUBERNETES_VERSION: ${{ inputs.kubernetes_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.keights_tag }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 14400
      - run: make release-one VERSION=${VERSION} OS=linux ARCH=amd64
      - uses: actions/upload-artifact@v4
        with:
          name: keights-linux-amd64
          path: _output/staging/keights/linux/amd64/keights
          retention-days: 1
      - run: make image VERSION=${VERSION} KUBERNETES_VERSION=${KUBERNETES_VERSION}
      - run: make image-push VERSION=${VERSION} KUBERNETES_VERSION=${KUBERNETES_VERSION}
      - run: make stackbot VERSION=${VERSION}
      - run: |
          make ami \
              VERSION=${VERSION} \
              KUBERNETES_VERSION=${KUBERNETES_VERSION} \
              SUBNET_ID=${{ secrets.SUBNET_ID_PUBLIC }}
      - id: ami
        run: |
          echo "ami_id=$(cat _output/ami/ami-id)" >> "${GITHUB_OUTPUT}"
          echo "ami_name=$(cat _output/ami/ami-name)" >> "${GITHUB_OUTPUT}"
      - id: bucket
        run: |
          name=$(make -s stackbot-bucket-create \
              AWS_REGION=us-east-1 \
              BUCKET_PREFIX=keights-ami-${{ github.run_id }})
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
      - run: |
          make stackbot-upload \
              VERSION=${VERSION} \
              BUCKET=${{ steps.bucket.outputs.name }} \
              PREFIX=lambda
      - id: source
        env:
          TARGET_KUBERNETES_VERSION: ${{ inputs.kubernetes_version }}
        run: |
          out=$(./hack/ami-find-upgrade-source)
          if [ "${out}" = "SKIP" ]; then
              echo "no upgrade-from source AMI; skipping upgrade scenario"
          else
              echo "${out}" >> "${GITHUB_OUTPUT}"
          fi
      - id: scenarios
        run: |
          if [ -n "${{ steps.source.outputs.AMI_NAME }}" ]; then
              echo 'list=["fresh","upgrade"]' >> "${GITHUB_OUTPUT}"
          else
              echo 'list=["fresh"]' >> "${GITHUB_OUTPUT}"
          fi

  e2e:
    needs: build
    uses: ./.github/workflows/e2e-run.yml
    with:
      version: ${{ inputs.keights_tag }}
      kubernetes_version: ${{ inputs.kubernetes_version }}
      ami_name: ${{ needs.build.outputs.ami_name }}
      bucket: ${{ needs.build.outputs.bucket }}
      scenarios: ${{ needs.build.outputs.scenarios }}
      keights_artifact_name: keights-linux-amd64
      source_ami_name: ${{ needs.build.outputs.source_ami_name }}
      source_version: ${{ needs.build.outputs.source_version }}
    secrets: inherit

  cleanup:
    needs: [build, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      packages: write
    env:
      VERSION: ${{ inputs.keights_tag }}
      KUBERNETES_VERSION: ${{ inputs.kubernetes_version }}
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.keights_tag }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 14400
      - if: (needs.build.result != 'success' || needs.e2e.result != 'success') && needs.build.outputs.ami_id != ''
        continue-on-error: true
        run: |
          mkdir -p _output/ami
          echo "${{ needs.build.outputs.ami_id }}" > _output/ami/ami-id
          make ami-destroy
      - if: needs.build.outputs.bucket != ''
        continue-on-error: true
        run: make stackbot-bucket-delete BUCKET=${{ needs.build.outputs.bucket }}
      - if: needs.build.result != 'success' || needs.e2e.result != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make image-delete VERSION=${VERSION} KUBERNETES_VERSION=${KUBERNETES_VERSION}
