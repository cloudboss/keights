name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  test-build:
    uses: ./.github/workflows/common.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ github.ref_name }}
      # Sanity-build only. Production images are built per (keights, kubernetes)
      # pair by .github/workflows/ami.yml.
      push_image: false

  upload-stackbot:
    runs-on: ubuntu-24.04
    needs:
      - test-build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: |
          make stackbot-upload \
              VERSION=${{ github.ref_name }} \
              BUCKET=cloudboss-keights \
              PREFIX=lambda

  release:
    runs-on: ubuntu-24.04
    needs:
      - test-build
      - upload-stackbot
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: docker://antonyurchenko/git-release:v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRE_RELEASE: "${{ contains(github.ref_name, '-') }}"
        with:
          args: |
            artifacts/keights-${{ github.ref_name }}-linux-amd64.tar.gz
            artifacts/keights-${{ github.ref_name }}-darwin-amd64.tar.gz
            artifacts/keights-${{ github.ref_name }}-darwin-arm64.tar.gz
            artifacts/keights-terraform-${{ github.ref_name }}.tar.gz

  cleanup:
    if: failure() || cancelled()
    runs-on: ubuntu-24.04
    needs:
      - test-build
      - upload-stackbot
      - release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - continue-on-error: true
        run: |
          make stackbot-delete \
              VERSION=${{ github.ref_name }} \
              BUCKET=cloudboss-keights \
              PREFIX=lambda
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release-delete RELEASE_TAG=${{ github.ref_name }}
